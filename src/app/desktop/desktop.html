<main id="desktop">
  <img
    src="https://cdn.mos.cms.futurecdn.net/52HVcjStCQTsaDJWzEt946.jpg"
    alt="Desktop Background"
  />

  <div [class.focused]="isPdfIconActive" (click)="activateIcon('pdf')" class="pcicon" cdkDrag>
    <img class="pdf" src="../../images/pdf64px.png" alt="" />
    <span>My Resume</span>
    <!-- <span>{{pdfClickCount}}</span> -->
  </div>

  <div [class.focused]="isAboutIconActive" (click)="activateIcon('about')" class="pcicon" cdkDrag>
    <img class="pdf" src="../../images/notes.png" alt="" />
    <span>About Me</span>
    <!-- <span>{{aboutClickCount}}</span> -->

  </div>

  <app-taskbar></app-taskbar>
  <app-window *ngIf="isPdfOpen"
   (close)="handlePdfClose()" (maximize)="maximizeWindow()"></app-window>  
</main>
